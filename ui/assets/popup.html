<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Turbo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0d0d0d;
    --fg: #fafafa;
    --muted: #a3a3a3;
    --dim: #6b6b6b;
    --accent: #ea580c;
    --up: #4ade80;
    --down: #ef4444;
    --hairline: rgba(255, 255, 255, 0.08);
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  /* The whole popup is one rounded card; the native window is transparent
     and borderless, so this element *is* the visible window. */
  .panel {
    position: relative;
    height: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    top: -120px; left: 50%;
    width: 260px; height: 260px;
    margin-left: -130px;
    border-radius: 9999px;
    background: rgba(234, 88, 12, 0.18);
    filter: blur(90px);
    pointer-events: none;
  }

  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .brand {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .btn-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    padding: 0;
    border: 1px solid var(--hairline);
    border-radius: 9999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
  }
  .btn-close:hover { background: rgba(255, 255, 255, 0.07); color: var(--fg); }
  .btn-close:active { opacity: 0.82; }
  .btn-close:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.45); outline-offset: 2px; }

  .view { display: none; flex: 1; flex-direction: column; position: relative; }
  .view.is-active { display: flex; }

  .hint {
    margin: 0 0 12px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }
  .dots {
    display: inline-block;
    width: 1.25em;
    overflow: hidden;
    vertical-align: bottom;
    text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0% { width: 0; } 100% { width: 1.25em; } }

  /* ---- radar: the "reaching for servers" animation ---------------------- */
  .radar {
    position: relative;
    width: 92px; height: 92px;
    margin: 2px auto 12px;
    flex: none;
  }
  .radar-core {
    position: absolute;
    top: 50%; left: 50%;
    width: 9px; height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 9999px;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(234, 88, 12, 0.8);
  }
  /* Three rings on the same keyframes, staggered — reads as a steady pulse
     outward rather than three separate blips. */
  .ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 92px; height: 92px;
    margin: -46px 0 0 -46px;
    border: 1px solid rgba(234, 88, 12, 0.5);
    border-radius: 9999px;
    opacity: 0;
    animation: ping 2.4s var(--ease) infinite;
  }
  .ring:nth-child(3) { animation-delay: 0.8s; }
  .ring:nth-child(4) { animation-delay: 1.6s; }
  @keyframes ping {
    0%   { transform: scale(0.12); opacity: 0.9; }
    70%  { opacity: 0.12; }
    100% { transform: scale(1); opacity: 0; }
  }
  /* Frozen rings once every host is down: the animation implies progress, and
     showing progress that is not happening is a lie. */
  .radar.is-stalled .ring { animation-play-state: paused; opacity: 0.1; }
  .radar.is-stalled .radar-core { background: var(--down); box-shadow: none; }

  /* ---- host list -------------------------------------------------------- */
  .hosts {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    max-height: 118px;
    overflow-y: auto;
    font-size: 0.72rem;
  }
  .hosts::-webkit-scrollbar { width: 0; }
  .host {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 2px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    opacity: 0;
    animation: row-in 0.35s ease forwards;
  }
  .host:last-child { border-bottom: 0; }
  @keyframes row-in { to { opacity: 1; } }

  .host-dot {
    position: relative;
    width: 6px; height: 6px;
    border-radius: 9999px;
    background: var(--dim);
    flex: none;
  }
  .host.is-probing .host-dot { background: var(--accent); }
  /* The expanding halo is a pseudo-element so it cannot affect row layout. */
  .host.is-probing .host-dot::after {
    content: "";
    position: absolute;
    inset: -3px;
    border: 1px solid var(--accent);
    border-radius: 9999px;
    animation: ping 1.1s var(--ease) infinite;
  }
  .host.is-up .host-dot { background: var(--up); }
  .host.is-down .host-dot { background: var(--down); }

  .host-addr {
    flex: 1;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .host-ping { color: var(--dim); font-variant-numeric: tabular-nums; }
  .host.is-up .host-ping { color: var(--up); }

  /* ---- rewards ---------------------------------------------------------- */
  .rewards {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .rewards-label {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .rewards-value {
    font-size: 2.1rem;
    font-weight: 600;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .rewards-note { font-size: 0.68rem; color: var(--dim); }

  /* ---- buttons ---------------------------------------------------------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0.55rem 1rem;
    border: 1px solid transparent;
    border-radius: 8px;
    font: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    color: #0a0a0a;
    background: #e8e8e8;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), color 0.15s var(--ease),
                border-color 0.15s var(--ease), opacity 0.15s var(--ease);
  }
  .btn:hover:not(:disabled):not(.is-muted) { background: #fafafa; }
  .btn:active:not(:disabled) { opacity: 0.82; }
  .btn:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.45); outline-offset: 2px; }
  .btn:disabled {
    opacity: 0.55;
    cursor: wait;
    /* WebKit still matches :hover on disabled buttons; block it at hit-test. */
    pointer-events: none;
  }
  /* Muted, not disabled: a retry is always safe to ask for, it just is not
     the obvious move until every host has actually failed. */
  .btn.is-muted {
    background: rgba(255, 255, 255, 0.04);
    border-color: var(--hairline);
    color: var(--dim);
  }
  .btn.is-muted:hover:not(:disabled) { background: rgba(255, 255, 255, 0.07); }
  .spacer { flex: 1; }
</style>
</head>
<body>
  <div class="panel">
    <div class="glow" aria-hidden="true"></div>

    <header>
      <h1 class="brand">Turbo</h1>
      <button id="close" type="button" class="btn-close" aria-label="Close">
        <svg viewBox="0 0 14 14" width="11" height="11" aria-hidden="true">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- connecting / retry -->
    <section id="view-connecting" class="view">
      <div id="radar" class="radar" aria-hidden="true">
        <span class="radar-core"></span>
        <span class="ring"></span>
        <span class="ring"></span>
        <span class="ring"></span>
      </div>
      <p id="connecting-hint" class="hint">Connecting to network<span class="dots">...</span></p>
      <ul id="hosts" class="hosts" aria-live="polite"></ul>
      <div class="spacer"></div>
      <button id="retry" type="button" class="btn is-muted">Retry</button>
    </section>

    <!-- pair to account -->
    <section id="view-pairing" class="view">
      <div class="spacer"></div>
      <p class="hint">Pair this node to your account to start earning.</p>
      <button id="pair" type="button" class="btn">Pair to Account</button>
      <div class="spacer"></div>
    </section>

    <!-- connected -->
    <section id="view-connected" class="view">
      <div class="rewards">
        <span class="rewards-label">Total earned</span>
        <span id="rewards" class="rewards-value">$0.00</span>
        <span class="rewards-note">This node</span>
      </div>
      <button id="dashboard" type="button" class="btn is-muted">Open Dashboard</button>
    </section>
  </div>

<script>
(function () {
  "use strict";

  // One bridge, three webviews: WKWebView (macOS) and WebKitGTK (Linux) both
  // expose webkit.messageHandlers; WebView2 exposes chrome.webview.
  function send(action) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.turbo) {
        window.webkit.messageHandlers.turbo.postMessage(action);
      } else if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(action);
      }
    } catch (e) {
      /* the popup must never break because the bridge is missing */
    }
  }

  var el = {
    radar: document.getElementById("radar"),
    connectingHint: document.getElementById("connecting-hint"),
    hosts: document.getElementById("hosts"),
    retry: document.getElementById("retry"),
    rewards: document.getElementById("rewards"),
    views: {
      connecting: document.getElementById("view-connecting"),
      pairing: document.getElementById("view-pairing"),
      connected: document.getElementById("view-connected")
    }
  };

  var retryCooldown = false;
  var latestHosts = [];

  function allHostsDown() {
    return latestHosts.length > 0 && latestHosts.every(function (h) { return h.status === "down"; });
  }

  function formatUSD(raw) {
    var n = parseFloat(raw);
    if (!isFinite(n)) return "$0.00";
    // Small balances are the norm early on, so keep enough decimals for the
    // number to actually move; large ones do not need that noise. Trailing
    // zeros are then trimmed so "0.0015" does not render as "$0.001500",
    // but never below 2 decimals, which is what money is expected to look like.
    var decimals = n > 0 && n < 0.01 ? 6 : (n < 1 ? 4 : 2);
    var text = n.toFixed(decimals);
    if (text.indexOf(".") !== -1) {
      text = text.replace(/0+$/, "").replace(/\.$/, "");
      var dot = text.indexOf(".");
      var places = dot === -1 ? 0 : text.length - dot - 1;
      if (places < 2) text = n.toFixed(2);
    }
    return "$" + text;
  }

  function pingLabel(host) {
    if (host.status === "up" && host.pingMs != null && host.pingMs >= 0) return host.pingMs + "ms";
    if (host.status === "down") return "down";
    if (host.status === "probing") return "…";
    return "";
  }

  function renderHosts(hosts) {
    latestHosts = Array.isArray(hosts) ? hosts : [];
    el.hosts.textContent = "";
    latestHosts.forEach(function (host, i) {
      var li = document.createElement("li");
      li.className = "host is-" + (host.status || "pending");
      li.style.animationDelay = (i * 40) + "ms";

      var dot = document.createElement("span");
      dot.className = "host-dot";

      var addr = document.createElement("span");
      addr.className = "host-addr";
      addr.textContent = host.addr || "";

      var ping = document.createElement("span");
      ping.className = "host-ping";
      ping.textContent = pingLabel(host);

      li.appendChild(dot);
      li.appendChild(addr);
      li.appendChild(ping);
      el.hosts.appendChild(li);
    });
  }

  function renderConnecting(state) {
    var stalled = allHostsDown();
    el.radar.classList.toggle("is-stalled", stalled);
    el.connectingHint.innerHTML = stalled
      ? "All networks down, please retry later"
      : 'Connecting to network<span class="dots">...</span>';
    el.retry.classList.toggle("is-muted", !stalled);
    el.retry.disabled = retryCooldown;
  }

  function setState(state) {
    if (!state || typeof state !== "object") return;

    Object.keys(el.views).forEach(function (name) {
      el.views[name].classList.toggle("is-active", name === state.view);
    });

    renderHosts(state.hosts);
    renderConnecting(state);
    el.rewards.textContent = formatUSD(state.totalRewards);
  }

  el.retry.addEventListener("click", function () {
    if (el.retry.disabled) return;
    // Brief cooldown so an impatient double-click does not queue two dials.
    retryCooldown = true;
    el.retry.disabled = true;
    send("retry");
    setTimeout(function () {
      retryCooldown = false;
      el.retry.disabled = false;
    }, 1500);
  });

  document.getElementById("pair").addEventListener("click", function () { send("pair"); });
  document.getElementById("dashboard").addEventListener("click", function () { send("dashboard"); });
  document.getElementById("close").addEventListener("click", function () { send("close"); });

  // Called natively just before the window is hidden. A selection left behind
  // would still be highlighted the next time the popup opens, and on macOS a
  // live selection in a hidden webview keeps claiming the system services menu.
  function onHidden() {
    var sel = window.getSelection && window.getSelection();
    if (sel && sel.removeAllRanges) sel.removeAllRanges();
    if (document.activeElement && document.activeElement.blur) {
      document.activeElement.blur();
    }
  }

  // Belt and braces: the platforms differ in which of these they deliver when
  // a window is ordered out, and clearing twice is harmless.
  window.addEventListener("blur", onHidden);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) onHidden();
  });

  window.turbo = { setState: setState, onHidden: onHidden };

  // The page may have finished loading after Go already pushed state.
  send("ready");
})();
</script>
</body>
</html>
