name: Build Client

on:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
  pull_request:
    branches: [ main ]
    paths-ignore:
      - README.md
  release:
    types: [published]

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: Turbo.exe
            asset_name: Turbo_windows-amd64.exe

          - os: windows-latest
            goos: windows
            goarch: arm64
            output_name: Turbo.exe
            asset_name: Turbo_windows-arm64.exe

          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output_name: turbo-client
            asset_name: Turbo_linux-amd64

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            output_name: turbo-client
            asset_name: Turbo_linux-arm64

          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            output_name: Turbo
            asset_name: Turbo_macos-amd64.dmg

          - os: macos-latest
            goos: darwin
            goarch: arm64
            output_name: Turbo
            asset_name: Turbo_macos-arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build Windows
      if: matrix.goos == 'windows'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        go build -ldflags="-H windowsgui -s -w" -o dist/${{ matrix.output_name }}

    - name: Create Windows Installer
      if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
      run: |
        cd build
        iscc installer.iss

    - name: Build Linux
      if: matrix.goos == 'linux'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        sudo apt update
        sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev || \
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.0-dev
        
        mkdir -p dist
        go build -ldflags="-s -w" -o dist/${{ matrix.output_name }}

    - name: Build macOS
      if: matrix.goos == 'darwin'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        mkdir -p dist
        go build -ldflags="-s -w" -o build/${{ matrix.output_name }}
        
        mkdir -p build/Turbo.app/Contents/MacOS
        cp build/${{ matrix.output_name }} build/Turbo.app/Contents/MacOS/Turbo

    # Unsigned, the bundle carries only the ad-hoc signature the linker leaves
    # on an arm64 Mach-O and has no _CodeSignature/CodeResources at all, so
    # codesign reports "code has no resources but signature indicates they must
    # be present". Gatekeeper rejects that, and on a quarantined download —
    # which is every download from the website — macOS phrases the rejection as
    # "Turbo.app is damaged and can't be opened". Signing here is what makes a
    # downloaded build launchable at all, not a hardening extra.
    - name: Sign macOS app
      if: matrix.goos == 'darwin'
      env:
        MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      run: |
        if [ -z "$MACOS_CERT_P12" ]; then
          # No Developer ID configured: sign ad-hoc. That clears "damaged"; the
          # first launch still needs right-click > Open, which only a Developer
          # ID plus notarization removes.
          echo "No MACOS_CERT_P12 secret set — signing ad-hoc."
          codesign --force --sign - --identifier me.lished.turbo build/Turbo.app
        else
          # A throwaway keychain: the runner's login keychain is locked, and
          # codesign needs an unlocked one holding the identity.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Without this codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          # --options runtime is required for notarization to be accepted.
          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" build/Turbo.app
        fi

        # Fail the build rather than ship a bundle that repeats the bug.
        codesign --verify --strict --verbose=2 build/Turbo.app

    # Split from the build step so the DMG is always packaged from the signed
    # bundle: signing after packaging would leave the shipped copy unsigned.
    - name: Package macOS DMG
      if: matrix.goos == 'darwin'
      run: |
        brew install create-dmg || true
        mkdir -p dist
        create-dmg \
          --volname "Turbo Installer" \
          --volicon "build/assets/icon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Turbo.app" 200 190 \
          --hide-extension "Turbo.app" \
          --app-drop-link 400 190 \
          "dist/${{ matrix.asset_name }}" \
          "build/Turbo.app" || cp -r build/Turbo.app "dist/Turbo.app"

        cp -r build/Turbo.app "dist/Turbo.app"

    # Notarization is what lets a downloaded DMG open with no warning at all.
    # It no-ops when the secrets are absent, so the ad-hoc path above remains a
    # complete build on its own.
    - name: Notarize macOS DMG
      if: matrix.goos == 'darwin'
      env:
        MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
        MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      run: |
        if [ -z "$MACOS_NOTARY_APPLE_ID" ]; then
          echo "No notarization secrets set — skipping."
          exit 0
        fi

        # The DMG is the file users download, so it is quarantined on arrival
        # and needs its own signature, not just the app inside it.
        codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" \
          "dist/${{ matrix.asset_name }}"

        xcrun notarytool submit "dist/${{ matrix.asset_name }}" \
          --apple-id "$MACOS_NOTARY_APPLE_ID" \
          --password "$MACOS_NOTARY_PASSWORD" \
          --team-id "$MACOS_NOTARY_TEAM_ID" \
          --wait

        # Staple the ticket into the DMG so the first launch works offline.
        xcrun stapler staple "dist/${{ matrix.asset_name }}"
        xcrun stapler validate "dist/${{ matrix.asset_name }}"

    - name: Stage release asset
      if: matrix.goos != 'darwin'
      run: |
        cp "dist/${{ matrix.output_name }}" "dist/${{ matrix.asset_name }}"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/*
        if-no-files-found: warn

    - name: Upload Windows Installer
      if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
      uses: actions/upload-artifact@v4
      with:
        name: Turbo-setup.exe
        path: dist/Turbo-setup.exe
        if-no-files-found: warn

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The headless node (cmd/turbod), which is what the website's terminal
  # install command downloads. Separate from the desktop job above because it
  # shares almost none of it: no cgo, no GTK/WebKit, no tray, no DMG or
  # installer — just a static binary per platform. Windows is omitted: the
  # install script is POSIX shell, and Windows gets autostart from its own
  # installer instead.
  build-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: turbod_linux-amd64

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_name: turbod_linux-arm64

          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_name: turbod_macos-amd64

          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: turbod_macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build turbod
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.asset_name }} ./cmd/turbod

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}
        if-no-files-found: error

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}