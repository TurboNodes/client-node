name: Build Client

on:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
  pull_request:
    branches: [ main ]
    paths-ignore:
      - README.md
  release:
    types: [published]

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: Turbo.exe
            asset_name: Turbo_windows-amd64.exe

          - os: windows-latest
            goos: windows
            goarch: arm64
            output_name: Turbo.exe
            asset_name: Turbo_windows-arm64.exe

          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output_name: turbo-client
            asset_name: Turbo_linux-amd64

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            output_name: turbo-client
            asset_name: Turbo_linux-arm64

          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            output_name: Turbo
            asset_name: Turbo_macos-amd64.dmg

          - os: macos-latest
            goos: darwin
            goarch: arm64
            output_name: Turbo
            asset_name: Turbo_macos-arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build Windows
      if: matrix.goos == 'windows'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        go build -ldflags="-H windowsgui -s -w" -o dist/${{ matrix.output_name }}

    - name: Create Windows Installer
      if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
      run: |
        cd build
        iscc installer.iss

    - name: Build Linux
      if: matrix.goos == 'linux'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        sudo apt update
        sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev || \
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.0-dev
        
        mkdir -p dist
        go build -ldflags="-s -w" -o dist/${{ matrix.output_name }}

    - name: Build macOS
      if: matrix.goos == 'darwin'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        mkdir -p dist
        go build -ldflags="-s -w" -o build/${{ matrix.output_name }}
        
        mkdir -p build/Turbo.app/Contents/MacOS
        cp build/${{ matrix.output_name }} build/Turbo.app/Contents/MacOS/Turbo
        
        brew install create-dmg || true
        mkdir -p dist
        create-dmg \
          --volname "Turbo Installer" \
          --volicon "build/assets/icon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Turbo.app" 200 190 \
          --hide-extension "Turbo.app" \
          --app-drop-link 400 190 \
          "dist/${{ matrix.asset_name }}" \
          "build/Turbo.app" || cp -r build/Turbo.app "dist/Turbo.app"

        cp -r build/Turbo.app "dist/Turbo.app"

    - name: Stage release asset
      if: matrix.goos != 'darwin'
      run: |
        cp "dist/${{ matrix.output_name }}" "dist/${{ matrix.asset_name }}"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/*
        if-no-files-found: warn

    - name: Upload Windows Installer
      if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
      uses: actions/upload-artifact@v4
      with:
        name: Turbo-setup.exe
        path: dist/Turbo-setup.exe
        if-no-files-found: warn

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The headless node (cmd/turbod), which is what the website's terminal
  # install command downloads. Separate from the desktop job above because it
  # shares almost none of it: no cgo, no GTK/WebKit, no tray, no DMG or
  # installer — just a static binary per platform. Windows is omitted: the
  # install script is POSIX shell, and Windows gets autostart from its own
  # installer instead.
  build-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: turbod_linux-amd64

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_name: turbod_linux-arm64

          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_name: turbod_macos-amd64

          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: turbod_macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build turbod
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.asset_name }} ./cmd/turbod

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}
        if-no-files-found: error

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}